name: Claude CI Fixer

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  fix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Check retry count
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.workflow_run.head_branch;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'claude-ci-fixer.yml',
              branch: branch,
              status: 'completed',
              per_page: 5,
            });
            const recentFixAttempts = runs.data.workflow_runs.length;
            console.log(`Found ${recentFixAttempts} previous fix attempts on branch ${branch}`);
            if (recentFixAttempts >= 3) {
              core.setOutput('skip', 'true');
              console.log('Skipping — too many fix attempts. Needs human intervention.');
            } else {
              core.setOutput('skip', 'false');
            }

      - name: Checkout repository
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 1

      - name: Run Claude Code
        if: steps.check.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            The CI pipeline just failed on branch ${{ github.event.workflow_run.head_branch }}.

            Use the gh CLI to fetch the CI failure logs:
              gh run view ${{ github.event.workflow_run.id }} --repo ${{ github.repository }} --log-failed

            Read the logs, identify what failed, fix the issues, and push the fixes
            to the same branch.

            If this reveals a recurring mistake that could happen again in future,
            update CLAUDE.md with a note to prevent it.

      - name: Comment on PR if skipped
        if: steps.check.outputs.skip == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.workflow_run.head_branch;
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open',
            });
            if (prs.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prs.data[0].number,
                body: '⚠️ CI has failed 3+ times on this branch and automatic fixes have not resolved it. This needs human intervention.',
              });
            }