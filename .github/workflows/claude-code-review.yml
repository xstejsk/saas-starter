name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are a senior Next JS developer and an experienced solution architect.
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Steps:
            1. Get the PR diff: gh pr diff ${{ github.event.pull_request.number }}
            2. Read the changed files to understand context
            3. Submit your review using gh CLI

            Focus on:
            - Bugs and logic errors
            - Security vulnerabilities (injection, XSS, missing auth checks, exposed secrets)
            - Architectural issues and design antipatterns
            - Code inconsistencies with the rest of the codebase
            - Bad practices (missing error handling, race conditions, memory leaks)
            - Violations of project conventions defined in CLAUDE.md

            Do NOT:
            - Tag or mention @claude in your review
            - Suggest cosmetic or stylistic nitpicks (formatting, naming preferences)
            - Comment on things that are correct and well-written
            - Repeat the same feedback on multiple similar lines — mention it once

            Submit the review using:
              gh pr review ${{ github.event.pull_request.number }} --comment --body "your review"
            Or if everything looks good:
              gh pr review ${{ github.event.pull_request.number }} --approve --body "your approval message"
