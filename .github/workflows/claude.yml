name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch_prefix: "feature/"
          branch_name_template: "{{prefix}}issue-{{entityNumber}}"
          additional_permissions: |
            actions: read
          prompt: |
            MANDATORY before pushing or creating a PR:
            1. Run `npm install` if any dependencies were added or changed
            2. Run `npm run typecheck` — must pass with zero errors
            3. Run `npm run lint` — must pass with zero warnings
            4. Run `npm run build` — must pass with zero errors
            5. If ANY of the above fail, fix the issues and re-run until all pass
            6. Commit ALL changed files including package-lock.json
            7. Do NOT create a PR until all checks pass locally